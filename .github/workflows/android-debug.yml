name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug (universal)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Download gradle-wrapper.jar (si no existe)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Descargando gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          else
            echo "gradle-wrapper.jar ya presente."
          fi

      - name: Generate gradlew if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "Generando gradlew con Gradle wrapper..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Clean project build (force KSP regen)
        run: |
          echo "Borrando build y código generado por KSP..."
          rm -rf app/build
          rm -rf build
          ./gradlew clean --stacktrace --no-daemon

      - name: Build debug APK (no cache)
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró APK"; exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK encontrada: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30